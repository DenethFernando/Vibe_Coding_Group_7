<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini - Wrench & Bolt Animation</title>
    <style>
        :root {
            --bg: #e0e5ec;
            --steel: #a3abb1;
            --steel-dark: #707a83;
            --steel-light: #ced4da;
            --thread: #4a4e52;
            --accent: #2d3436;
        }

        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg);
            font-family: 'Segoe UI', system-ui, sans-serif;
        }

        .container {
            position: relative;
            width: 600px;
            height: 400px;
            background: #f8f9fa;
            border-radius: 20px;
            box-shadow: 20px 20px 60px #bec3c9, -20px -20px 60px #ffffff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        .label {
            position: absolute;
            bottom: 30px;
            color: var(--steel-dark);
            letter-spacing: 2px;
            font-size: 0.8rem;
            font-weight: bold;
        }

        /* Thread Pattern */
        .threads {
            fill: none;
            stroke: var(--thread);
            stroke-width: 2;
            stroke-linecap: round;
        }
    </style>
</head>
<body>

<div class="container">
    <svg viewBox="0 0 400 300">
        <rect x="50" y="135" width="250" height="30" fill="url(#boltGrad)" rx="2" />
        
        <g id="threadGroup" class="threads">
            </g>

        <rect x="40" y="120" width="20" height="60" fill="#555" rx="2" />

        <g id="nutGroup" transform="translate(200, 150)">
            <polygon points="20,-30 40,0 20,30 -20,30 -40,0 -20,-30" fill="url(#nutGrad)" stroke="#333" stroke-width="2" />
            <circle cx="0" cy="0" r="12" fill="#444" />
        </g>

        <g id="wrenchGroup" transform="translate(200, 150) rotate(-30)">
            <g transform="translate(0, 0)">
                <rect x="40" y="-12" width="160" height="24" fill="url(#wrenchGrad)" rx="5" stroke="#666" stroke-width="1" />
                <path d="M 50 -35 
                         A 40 40 0 1 0 50 35 
                         L 50 20 
                         A 25 25 0 0 1 50 -20 
                         Z" 
                      fill="url(#wrenchGrad)" stroke="#666" stroke-width="1" />
            </g>
        </g>

        <defs>
            <linearGradient id="boltGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#888" />
                <stop offset="50%" style="stop-color:#ccc" />
                <stop offset="100%" style="stop-color:#888" />
            </linearGradient>
            <linearGradient id="nutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" style="stop-color:#ced4da" />
                <stop offset="100%" style="stop-color:#707a83" />
            </linearGradient>
            <linearGradient id="wrenchGrad" x1="0%" y1="0%" x2="0%" y2="100%">
                <stop offset="0%" style="stop-color:#dee2e6" />
                <stop offset="50%" style="stop-color:#adb5bd" />
                <stop offset="100%" style="stop-color:#495057" />
            </linearGradient>
        </defs>
    </svg>
    <div class="label">PRECISION FASTENING SYSTEM</div>
</div>

<script>
    const threadGroup = document.getElementById('threadGroup');
    const nutGroup = document.getElementById('nutGroup');
    const wrenchGroup = document.getElementById('wrenchGroup');

    // Create Bolt Threads
    for (let i = 70; i < 290; i += 8) {
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        line.setAttribute("x1", i);
        line.setAttribute("y1", 135);
        line.setAttribute("x2", i + 4);
        line.setAttribute("y2", 165);
        threadGroup.appendChild(line);
    }

    let angle = -45;
    let nutX = 220;
    let direction = 1; // 1 for turning, -1 for resetting wrench
    let totalProgress = 0;

    function animate() {
        if (direction === 1) {
            // Tightening Stroke
            angle += 1.5;
            // The nut moves left (tightens) proportional to rotation
            nutX -= 0.15; 
            
            if (angle >= 45) {
                direction = -1; // Reset wrench for next turn
            }
        } else {
            // Reset Stroke (Wrench lifts slightly and swings back)
            angle -= 3;
            if (angle <= -45) {
                direction = 1;
            }
        }

        // Apply transformations
        // Nut only moves on the X axis
        nutGroup.setAttribute('transform', `translate(${nutX}, 150)`);
        
        // Wrench follows Nut X, but also rotates
        // We add a slight Y offset during reset to simulate "lifting" off the nut
        const lift = direction === -1 ? -5 : 0;
        wrenchGroup.setAttribute('transform', `translate(${nutX}, ${150 + lift}) rotate(${angle})`);

        // Loop the nut position if it gets too close to the head
        if (nutX < 80) nutX = 250;

        requestAnimationFrame(animate);
    }

    animate();
</script>

</body>
</html>
