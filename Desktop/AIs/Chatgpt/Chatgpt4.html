<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Six Shot Revolver Animation</title>

<style>

body{
margin:0;
background:#eef1f7;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
font-family:sans-serif;
}

svg{
background:white;
border-radius:10px;
box-shadow:0 12px 30px rgba(0,0,0,0.15);
}

.gunmetal{
fill:#8f98a3;
stroke:#555;
stroke-width:2;
}

.barrel{
fill:#6f7782;
}

.cylinder{
fill:#808a95;
}

.chamber{
fill:#333;
}

.spent{
fill:#111;
}

.hammer{
fill:#666;
}

.flash{
fill:orange;
opacity:0;
}

.smoke{
fill:#bbb;
opacity:0;
}

.casing{
fill:#d6b44c;
stroke:#8a6b20;
stroke-width:1;
}

</style>
</head>

<body>

<svg width="700" height="300" viewBox="0 0 700 300">

<!-- gun group for recoil -->
<g id="gun">

<!-- barrel -->
<rect x="300" y="130" width="260" height="40" class="gunmetal barrel"/>

<!-- muzzle flash -->
<polygon id="flash"
points="560,130 620,150 560,170 590,150"
class="flash"/>

<!-- smoke -->
<circle id="smoke" cx="600" cy="150" r="10" class="smoke"/>

<!-- frame -->
<rect x="220" y="120" width="90" height="60" class="gunmetal"/>

<!-- cylinder -->
<g id="cylinderGroup" transform="translate(260,150)">
<circle r="40" class="cylinder"/>

<!-- chambers -->
<g id="chambers"></g>

</g>

<!-- hammer -->
<rect id="hammer" x="215" y="100" width="20" height="30" class="hammer"/>

</g>

<!-- casings -->
<g id="casings"></g>

</svg>

<script>

const chambersGroup = document.getElementById("chambers")
const cylinder = document.getElementById("cylinderGroup")
const hammer = document.getElementById("hammer")
const flash = document.getElementById("flash")
const smoke = document.getElementById("smoke")
const gun = document.getElementById("gun")
const casings = document.getElementById("casings")

let shots = 0
let angle = 0

/* create 6 chambers */

let chambers = []

for(let i=0;i<6;i++){

let a = (i/6)*Math.PI*2

let x = Math.cos(a)*20
let y = Math.sin(a)*20

let c = document.createElementNS("http://www.w3.org/2000/svg","circle")

c.setAttribute("cx",x)
c.setAttribute("cy",y)
c.setAttribute("r",6)
c.setAttribute("class","chamber")

chambersGroup.appendChild(c)

chambers.push(c)

}

/* create brass casing */

function spawnCasing(){

let casing = document.createElementNS("http://www.w3.org/2000/svg","rect")

casing.setAttribute("width",8)
casing.setAttribute("height",16)
casing.setAttribute("class","casing")
casing.setAttribute("x",250)
casing.setAttribute("y",140)

casings.appendChild(casing)

let vx = Math.random()*4 + 2
let vy = -Math.random()*4 - 2
let rot = 0

function fall(){

vx *= 0.98
vy += 0.25

let x = parseFloat(casing.getAttribute("x")) + vx
let y = parseFloat(casing.getAttribute("y")) + vy

rot += 10

casing.setAttribute("x",x)
casing.setAttribute("y",y)
casing.setAttribute("transform",`rotate(${rot} ${x+4} ${y+8})`)

if(y < 260){
requestAnimationFrame(fall)
}

}

fall()

}

/* fire cycle */

function fireShot(){

if(shots >= 6) return

/* hammer cock */
hammer.setAttribute("y",90)

setTimeout(()=>{

/* hammer drop */
hammer.setAttribute("y",100)

/* muzzle flash */
flash.style.opacity = 1

/* smoke */
smoke.style.opacity = 0.7
smoke.setAttribute("r",10)

/* recoil */
gun.setAttribute("transform","translate(-10,0)")

/* mark spent chamber */
chambers[shots].setAttribute("class","spent")

/* casing */
spawnCasing()

setTimeout(()=>{

flash.style.opacity = 0
gun.setAttribute("transform","translate(0,0)")

},80)

setTimeout(()=>{

smoke.style.opacity = 0
smoke.setAttribute("r",20)

},300)

/* rotate cylinder */
angle += 60

cylinder.setAttribute(
"transform",
`translate(260,150) rotate(${angle})`
)

shots++

/* next shot */
setTimeout(fireShot,600)

},120)

}

/* start sequence */
setTimeout(fireShot,500)

</script>

</body>
</html>
