<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Wrench Tightening Nut</title>

<style>

body{
margin:0;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
background:#f4f6fb;
font-family:sans-serif;
}

svg{
background:white;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.15);
}

/* metal style */

.metal{
fill:url(#metalGrad);
stroke:#777;
stroke-width:2;
}

.bolt{
stroke:#666;
stroke-width:6;
}

.thread{
stroke:#888;
stroke-width:2;
}

.nut{
fill:#9aa3ad;
stroke:#555;
stroke-width:2;
}

.wrench{
fill:url(#metalGrad);
stroke:#666;
stroke-width:2;
}

</style>
</head>

<body>

<svg width="500" height="350" viewBox="0 0 500 350">

<defs>

<linearGradient id="metalGrad" x1="0" x2="1">
<stop offset="0%" stop-color="#d6dbe3"/>
<stop offset="50%" stop-color="#9ea7b2"/>
<stop offset="100%" stop-color="#e4e8ef"/>
</linearGradient>

</defs>

<!-- Bolt -->
<line x1="250" y1="50" x2="250" y2="300" class="bolt"/>

<!-- Threads -->
<g id="threads">
</g>

<!-- Nut -->
<polygon id="nut" class="nut"
points="
230,140
250,130
270,140
270,160
250,170
230,160
"/>

<!-- Wrench -->
<g id="wrench">

<rect x="250" y="130" width="120" height="20" rx="6" class="wrench"/>

<path d="
M245 140
L230 125
L210 135
L215 155
L235 160
Z" class="wrench"/>

</g>

</svg>

<script>

const wrench = document.getElementById("wrench")
const nut = document.getElementById("nut")
const threads = document.getElementById("threads")

/* create thread pattern */
for(let i=0;i<25;i++){
let line=document.createElementNS("http://www.w3.org/2000/svg","line")
line.setAttribute("x1",242)
line.setAttribute("x2",258)
line.setAttribute("y1",70+i*8)
line.setAttribute("y2",75+i*8)
line.setAttribute("class","thread")
threads.appendChild(line)
}

let angle=0
let nutY=0

function animate(){

angle+=0.05
nutY+=0.05

let deg=angle*180/Math.PI

/* wrench rotates around nut */
wrench.setAttribute(
"transform",
`rotate(${deg} 250 150)`
)

/* nut rotates and moves down bolt */
nut.setAttribute(
"transform",
`rotate(${deg} 250 150) translate(0 ${nutY})`
)

/* loop */
if(nutY>80){
nutY=0
angle=0
}

requestAnimationFrame(animate)

}

animate()

</script>

</body>
</html>
