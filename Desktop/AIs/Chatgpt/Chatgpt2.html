<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>4-Stroke Engine Animation</title>

<style>

body{
background:#f6f7fb;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
margin:0;
font-family:sans-serif;
}

svg{
background:white;
border-radius:10px;
box-shadow:0 10px 30px rgba(0,0,0,0.1);
}

.cylinder{
fill:#e5e8ef;
}

.piston{
fill:#8c9db5;
}

.rod{
stroke:#555;
stroke-width:8;
stroke-linecap:round;
}

.crank{
stroke:#444;
stroke-width:10;
}

.crankpin{
fill:#444;
}

.air{
fill:rgba(80,160,255,0.6);
}

.fire{
fill:rgba(255,160,0,0.8);
}

.exhaust{
fill:rgba(120,120,120,0.6);
}

.valve{
fill:#666;
}

.label{
font-size:14px;
fill:#333;
font-weight:bold;
}

</style>
</head>

<body>

<svg width="500" height="400" viewBox="0 0 500 400">

<!-- Cylinder -->
<rect x="220" y="50" width="60" height="200" class="cylinder"/>

<!-- Gas visualization -->
<rect id="gas" x="220" y="60" width="60" height="180" opacity="0"/>

<!-- Valves -->
<rect x="210" y="40" width="20" height="20" class="valve"/>
<rect x="270" y="40" width="20" height="20" class="valve"/>

<!-- Piston -->
<rect id="piston" x="220" y="150" width="60" height="25" class="piston"/>

<!-- Connecting rod -->
<line id="rod" x1="250" y1="175" x2="250" y2="300" class="rod"/>

<!-- Crankshaft -->
<circle cx="250" cy="320" r="25" fill="none" class="crank"/>

<!-- Crank pin -->
<circle id="crankpin" cx="250" cy="295" r="8" class="crankpin"/>

<!-- Labels -->
<text x="200" y="380" class="label" id="phaseLabel">INTAKE</text>

</svg>

<script>

const piston = document.getElementById("piston")
const rod = document.getElementById("rod")
const crankpin = document.getElementById("crankpin")
const gas = document.getElementById("gas")
const label = document.getElementById("phaseLabel")

let angle = 0

const crankRadius = 25
const rodLength = 110

function animate(){

angle += 0.03

let cx = 250
let cy = 320

/* crank pin */
let pinX = cx + crankRadius * Math.sin(angle)
let pinY = cy - crankRadius * Math.cos(angle)

crankpin.setAttribute("cx",pinX)
crankpin.setAttribute("cy",pinY)

/* piston position using slider-crank geometry */
let pistonY = pinY - Math.sqrt(rodLength*rodLength - (pinX-cx)*(pinX-cx))

piston.setAttribute("y",pistonY-25)

/* rod position */
rod.setAttribute("x1",250)
rod.setAttribute("y1",pistonY)
rod.setAttribute("x2",pinX)
rod.setAttribute("y2",pinY)

/* determine engine stroke */
let cycle = (angle % (Math.PI*2))

if(cycle < Math.PI/2){

gas.setAttribute("class","air")
gas.setAttribute("opacity","0.7")
label.textContent="INTAKE"

}
else if(cycle < Math.PI){

gas.setAttribute("opacity","0")
label.textContent="COMPRESSION"

}
else if(cycle < Math.PI*1.5){

gas.setAttribute("class","fire")
gas.setAttribute("opacity","0.9")
label.textContent="POWER"

}
else{

gas.setAttribute("class","exhaust")
gas.setAttribute("opacity","0.6")
label.textContent="EXHAUST"

}

requestAnimationFrame(animate)

}

animate()

</script>

</body>
</html>
