<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>4-Stroke Engine</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Bebas+Neue&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #0e1117; --panel: #161b24; --border: #2a3040;
    --accent: #4af0c8; --text: #c8d4e8; --dim: #5a6880;
    --intake: #3a9fff; --combustion: #ff8c00; --exhaust: #8a9aa0;
  }
  body {
    background: var(--bg); min-height: 100vh;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-family: 'Share Tech Mono', monospace;
    color: var(--text); gap: 0;
  }
  header { text-align: center; margin-bottom: 22px; }
  header h1 {
    font-family: 'Bebas Neue', sans-serif; font-size: 2.4rem;
    letter-spacing: 0.18em; color: var(--accent);
    text-shadow: 0 0 24px rgba(74,240,200,0.35);
  }
  header p { font-size: 0.68rem; letter-spacing: 0.25em; color: var(--dim); margin-top: 2px; }
  .layout { display: flex; gap: 28px; align-items: flex-start; }
  .canvas-wrap {
    background: var(--panel); border: 1.5px solid var(--border); border-radius: 6px;
    box-shadow: 0 0 40px rgba(0,0,0,0.6), inset 0 0 60px rgba(0,0,0,0.3); overflow: hidden;
  }
  canvas { display: block; }
  .side { width: 200px; display: flex; flex-direction: column; gap: 16px; }
  .info-box { background: var(--panel); border: 1.5px solid var(--border); border-radius: 6px; padding: 14px 16px; }
  .info-box h3 { font-size: 0.6rem; letter-spacing: 0.3em; color: var(--dim); text-transform: uppercase; margin-bottom: 10px; border-bottom: 1px solid var(--border); padding-bottom: 6px; }
  .stroke-list { display: flex; flex-direction: column; gap: 8px; }
  .stroke-item { display: flex; align-items: center; gap: 10px; font-size: 0.75rem; padding: 5px 8px; border-radius: 4px; border: 1px solid transparent; transition: all 0.25s ease; opacity: 0.38; }
  .stroke-item.active { opacity: 1; border-color: var(--border); background: rgba(255,255,255,0.04); }
  .stroke-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 6px currentColor; }
  .stroke-item[data-s="0"] .stroke-dot { background: var(--intake); color: var(--intake); }
  .stroke-item[data-s="1"] .stroke-dot { background: #bbb; color: #bbb; }
  .stroke-item[data-s="2"] .stroke-dot { background: var(--combustion); color: var(--combustion); }
  .stroke-item[data-s="3"] .stroke-dot { background: var(--exhaust); color: var(--exhaust); }
  .stroke-name { flex: 1; }
  .stroke-piston { font-size: 0.6rem; color: var(--dim); }
  .gauge-row { display: flex; flex-direction: column; gap: 7px; }
  .gauge { display: flex; flex-direction: column; gap: 3px; }
  .gauge-label { font-size: 0.58rem; color: var(--dim); letter-spacing: 0.15em; display: flex; justify-content: space-between; }
  .gauge-track { height: 5px; background: #1e2530; border-radius: 3px; overflow: hidden; }
  .gauge-fill { height: 100%; border-radius: 3px; transition: width 0.08s linear; }
  #gRpm .gauge-fill  { background: linear-gradient(90deg, var(--accent), #00e8ff); }
  #gPres .gauge-fill { background: linear-gradient(90deg, #ff6b35, var(--combustion)); }
  #gTemp .gauge-fill { background: linear-gradient(90deg, #4af0c8, #ff4444); }
  .rpm-display { font-family: 'Bebas Neue', sans-serif; font-size: 2.2rem; color: var(--accent); text-shadow: 0 0 16px rgba(74,240,200,0.5); text-align: center; letter-spacing: 0.1em; line-height: 1; margin-top: 4px; }
  .rpm-unit { font-size: 0.6rem; color: var(--dim); text-align: center; letter-spacing: 0.2em; }
  .ctrl { display: flex; flex-direction: column; gap: 8px; }
  .ctrl label { font-size: 0.6rem; color: var(--dim); letter-spacing: 0.2em; display: flex; justify-content: space-between; }
  input[type=range] { -webkit-appearance: none; width: 100%; height: 4px; background: #1e2530; border-radius: 2px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--accent); cursor: pointer; box-shadow: 0 0 8px rgba(74,240,200,0.6); }
</style>
</head>
<body>
<header>
  <h1>4-Stroke Engine</h1>
  <p>Cross-section · Internal combustion cycle</p>
</header>
<div class="layout">
  <div class="canvas-wrap"><canvas id="c" width="420" height="520"></canvas></div>
  <div class="side">
    <div class="info-box">
      <h3>Cycle Phase</h3>
      <div class="stroke-list" id="strokeList">
        <div class="stroke-item" data-s="0"><div class="stroke-dot"></div><span class="stroke-name">Intake</span><span class="stroke-piston">↓</span></div>
        <div class="stroke-item" data-s="1"><div class="stroke-dot"></div><span class="stroke-name">Compression</span><span class="stroke-piston">↑</span></div>
        <div class="stroke-item" data-s="2"><div class="stroke-dot"></div><span class="stroke-name">Power</span><span class="stroke-piston">↓</span></div>
        <div class="stroke-item" data-s="3"><div class="stroke-dot"></div><span class="stroke-name">Exhaust</span><span class="stroke-piston">↑</span></div>
      </div>
    </div>
    <div class="info-box">
      <h3>Engine Data</h3>
      <div class="rpm-display" id="rpmDisp">1200</div>
      <div class="rpm-unit">RPM</div>
      <div class="gauge-row" style="margin-top:12px">
        <div class="gauge" id="gRpm"><div class="gauge-label"><span>SPEED</span><span id="lRpm">50%</span></div><div class="gauge-track"><div class="gauge-fill" style="width:50%"></div></div></div>
        <div class="gauge" id="gPres"><div class="gauge-label"><span>PRESSURE</span><span id="lPres">0%</span></div><div class="gauge-track"><div class="gauge-fill" style="width:0%"></div></div></div>
        <div class="gauge" id="gTemp"><div class="gauge-label"><span>TEMP</span><span id="lTemp">0%</span></div><div class="gauge-track"><div class="gauge-fill" style="width:0%"></div></div></div>
      </div>
    </div>
    <div class="info-box">
      <h3>Speed Control</h3>
      <div class="ctrl">
        <label><span>ENGINE SPEED</span><span id="spdVal">1200 rpm</span></label>
        <input type="range" id="speedSlider" min="200" max="3600" value="1200" step="100">
      </div>
    </div>
  </div>
</div>

<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;

const CX = W / 2;
const CYL_W = 110, CYL_WALL = 18;
const HEAD_Y = 58, CYL_BOT = 340;
const CYL_H = CYL_BOT - HEAD_Y;
const PISTON_H = 52, PISTON_W = CYL_W - 4;
const CRANK_CY = 428, CRANK_R = 62, CON_ROD_L = 128;
const VALVE_Y_CLOSED = HEAD_Y + 7, VALVE_LIFT = 13;

let crankAngle = 0, rpm = 1200, lastTs = null;

function getStroke() {
  const a = ((crankAngle % (4*Math.PI)) + 4*Math.PI) % (4*Math.PI);
  return Math.floor(a / Math.PI);
}
function getStrokeT() {
  const a = ((crankAngle % (4*Math.PI)) + 4*Math.PI) % (4*Math.PI);
  return (a % Math.PI) / Math.PI;
}
function getPistonY(angle) {
  const cx = CRANK_R * Math.sin(angle);
  const rodAngle = Math.asin(Math.max(-0.999, Math.min(0.999, cx / CON_ROD_L)));
  const dist = CRANK_R * Math.cos(angle) + CON_ROD_L * Math.cos(rodAngle);
  const TDC = CRANK_R + CON_ROD_L, BDC = CON_ROD_L - CRANK_R;
  const norm = (TDC - dist) / (TDC - BDC);
  return HEAD_Y + norm * (CYL_H - PISTON_H);
}
function getCrankPin(angle) {
  return { x: CX + CRANK_R * Math.sin(angle), y: CRANK_CY - CRANK_R * Math.cos(angle) };
}
function getWristPin(pistonTopY) {
  return { x: CX, y: pistonTopY + PISTON_H * 0.62 };
}

function roundRect(x, y, w, h, r) {
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}

function drawBG() {
  ctx.fillStyle = '#0e1117'; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle = 'rgba(42,48,64,0.4)'; ctx.lineWidth = 0.5;
  for (let x=0;x<W;x+=20){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke();}
  for (let y=0;y<H;y+=20){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke();}
}

function drawBlock() {
  const lx = CX-CYL_W/2-CYL_WALL, rx = CX+CYL_W/2+CYL_WALL;
  const ty = HEAD_Y-48, by = CYL_BOT+22;
  // Left wall
  let g = ctx.createLinearGradient(lx,0,lx+CYL_WALL,0);
  g.addColorStop(0,'#1e2530'); g.addColorStop(0.4,'#4a5870'); g.addColorStop(0.7,'#3a4555'); g.addColorStop(1,'#1a2030');
  ctx.fillStyle = g; ctx.fillRect(lx,ty,CYL_WALL,by-ty);
  // Right wall
  g = ctx.createLinearGradient(rx-CYL_WALL,0,rx,0);
  g.addColorStop(0,'#1a2030'); g.addColorStop(0.3,'#3a4555'); g.addColorStop(0.6,'#4a5870'); g.addColorStop(1,'#1e2530');
  ctx.fillStyle = g; ctx.fillRect(rx-CYL_WALL,ty,CYL_WALL,by-ty);
  // Bore inner edges
  ctx.strokeStyle = 'rgba(100,120,155,0.4)'; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(CX-CYL_W/2,HEAD_Y); ctx.lineTo(CX-CYL_W/2,CYL_BOT); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(CX+CYL_W/2,HEAD_Y); ctx.lineTo(CX+CYL_W/2,CYL_BOT); ctx.stroke();
  // Cooling fins
  ctx.strokeStyle = 'rgba(74,88,110,0.55)'; ctx.lineWidth = 2;
  for (let fy=ty+18;fy<by-18;fy+=22) {
    ctx.beginPath(); ctx.moveTo(lx-9,fy); ctx.lineTo(lx,fy); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(rx,fy); ctx.lineTo(rx+9,fy); ctx.stroke();
  }
}

function drawHead(stroke, strokeT) {
  const lx = CX-CYL_W/2-CYL_WALL, rx = CX+CYL_W/2+CYL_WALL, ty = HEAD_Y-48;
  const g = ctx.createLinearGradient(lx,ty,rx,ty+48);
  g.addColorStop(0,'#2e3a50'); g.addColorStop(0.4,'#4a5870'); g.addColorStop(1,'#232e40');
  ctx.fillStyle = g; roundRect(lx,ty,rx-lx,48,4); ctx.fill();
  ctx.strokeStyle = '#3a4860'; ctx.lineWidth = 1.5; roundRect(lx,ty,rx-lx,48,4); ctx.stroke();
  // Spark plug
  const spx = CX, spy = HEAD_Y-12;
  ctx.fillStyle = '#7a8a98'; roundRect(spx-5,spy-18,10,22,2); ctx.fill();
  ctx.fillStyle = '#1e2838'; ctx.fillRect(spx-2,spy+2,4,9);
  // Spark
  if (stroke === 2 && strokeT < 0.1) {
    const i = 1 - strokeT/0.1;
    const r = 5+i*12;
    const sg = ctx.createRadialGradient(spx,spy+8,0,spx,spy+8,r);
    sg.addColorStop(0,`rgba(255,255,180,${i})`);
    sg.addColorStop(0.4,`rgba(255,160,0,${i*0.8})`);
    sg.addColorStop(1,'rgba(255,80,0,0)');
    ctx.fillStyle = sg; ctx.beginPath(); ctx.arc(spx,spy+8,r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = `rgba(255,255,160,${i})`; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.moveTo(spx,spy+10); ctx.lineTo(spx-4,spy+17); ctx.lineTo(spx+2,spy+17); ctx.lineTo(spx-2,spy+24); ctx.stroke();
  }
}

function drawValves(stroke, strokeT) {
  let iLift = 0, eLift = 0;
  if (stroke === 0) iLift = Math.sin(strokeT*Math.PI)*VALVE_LIFT;
  if (stroke === 3) eLift = Math.sin(strokeT*Math.PI)*VALVE_LIFT;
  _valve(CX-22, VALVE_Y_CLOSED+iLift, iLift>0.5, '#3a9fff');
  _valve(CX+22, VALVE_Y_CLOSED+eLift, eLift>0.5, '#b06030');
}
function _valve(vx, vy, open, col) {
  ctx.strokeStyle = col; ctx.lineWidth = 3;
  ctx.beginPath(); ctx.moveTo(vx,HEAD_Y-30); ctx.lineTo(vx,vy); ctx.stroke();
  ctx.fillStyle = open ? col : '#8a9ab0'; ctx.strokeStyle = open ? col : '#5a6a80'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(vx,vy,9,4,0,0,Math.PI*2); ctx.fill(); ctx.stroke();
  // Spring
  ctx.strokeStyle = 'rgba(100,120,150,0.55)'; ctx.lineWidth = 1;
  const st = HEAD_Y-30, sb = vy-8, segs = 7;
  ctx.beginPath();
  for(let i=0;i<=segs;i++){const t=i/segs;const sy=st+t*(sb-st);const sx=vx+(i%2===0?-3:3);i===0?ctx.moveTo(vx,sy):ctx.lineTo(sx,sy);}
  ctx.stroke();
}

function drawGas(pistonTopY, stroke, strokeT) {
  const l = CX-CYL_W/2+1, r = CX+CYL_W/2-1;
  const ch = pistonTopY - HEAD_Y;
  if (ch < 2) return;
  ctx.save(); ctx.beginPath(); ctx.rect(l,HEAD_Y,r-l,ch); ctx.clip();
  if (stroke === 0) {
    const a = 0.22+strokeT*0.2;
    const g = ctx.createLinearGradient(l,HEAD_Y,r,pistonTopY);
    g.addColorStop(0,`rgba(30,100,220,${a})`); g.addColorStop(1,`rgba(60,140,255,${a*0.6})`);
    ctx.fillStyle = g; ctx.fillRect(l,HEAD_Y,r-l,ch);
    for(let i=0;i<5;i++){
      const px=l+(Math.sin(Date.now()*0.003+i*1.3)*0.5+0.5)*(r-l);
      const py=HEAD_Y+((Date.now()*0.0015+i*0.38)%1)*ch;
      ctx.beginPath();ctx.arc(px,py,2,0,Math.PI*2);ctx.fillStyle='rgba(100,180,255,0.55)';ctx.fill();
    }
  } else if (stroke === 1) {
    const comp = 1-(pistonTopY-HEAD_Y)/(CYL_H-PISTON_H);
    const g = ctx.createRadialGradient(CX,HEAD_Y+ch*0.5,0,CX,HEAD_Y+ch*0.5,ch);
    g.addColorStop(0,`rgba(200,220,255,${0.18+comp*0.5})`); g.addColorStop(1,`rgba(60,100,200,${0.12+comp*0.25})`);
    ctx.fillStyle = g; ctx.fillRect(l,HEAD_Y,r-l,ch);
  } else if (stroke === 2) {
    const dec = Math.max(0,1-strokeT*1.5);
    if (dec > 0) {
      const g = ctx.createRadialGradient(CX,HEAD_Y+8,2,CX,HEAD_Y+ch*0.5,ch*(0.5+strokeT*0.7));
      g.addColorStop(0,`rgba(255,255,160,${dec*0.9})`); g.addColorStop(0.2,`rgba(255,180,0,${dec*0.75})`);
      g.addColorStop(0.6,`rgba(255,60,0,${dec*0.5})`); g.addColorStop(1,'rgba(100,20,0,0)');
      ctx.fillStyle = g; ctx.fillRect(l,HEAD_Y,r-l,ch);
    }
    const glow = Math.max(0,0.3-strokeT*0.3);
    if (glow>0){
      const g2=ctx.createLinearGradient(l,HEAD_Y,r,pistonTopY);
      g2.addColorStop(0,`rgba(255,120,0,${glow})`); g2.addColorStop(1,`rgba(180,40,0,${glow*0.3})`);
      ctx.fillStyle=g2; ctx.fillRect(l,HEAD_Y,r-l,ch);
    }
  } else if (stroke === 3) {
    const a = 0.18+(1-strokeT)*0.15;
    const g = ctx.createLinearGradient(l,HEAD_Y,r,pistonTopY);
    g.addColorStop(0,`rgba(120,130,140,${a})`); g.addColorStop(1,`rgba(80,90,100,${a*0.5})`);
    ctx.fillStyle = g; ctx.fillRect(l,HEAD_Y,r-l,ch);
    for(let i=0;i<4;i++){
      const px=l+(Math.sin(Date.now()*0.002+i*1.8)*0.4+0.5)*(r-l);
      const py=HEAD_Y+((Date.now()*0.001+i*0.35)%1)*ch;
      ctx.beginPath();ctx.arc(px,py,3+i,0,Math.PI*2);ctx.fillStyle='rgba(160,160,160,0.2)';ctx.fill();
    }
  }
  ctx.restore();
}

function drawPorts(stroke, strokeT) {
  const portY = HEAD_Y+12;
  const lx = CX-CYL_W/2-CYL_WALL, rx = CX+CYL_W/2+CYL_WALL;
  // intake duct left
  ctx.strokeStyle='#252f40'; ctx.lineWidth=10; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(lx,portY); ctx.lineTo(lx-26,portY); ctx.lineTo(lx-26,portY-22); ctx.stroke();
  ctx.strokeStyle='#3a4455'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(lx,portY); ctx.lineTo(lx-26,portY); ctx.lineTo(lx-26,portY-22); ctx.stroke();
  // exhaust duct right
  ctx.strokeStyle='#252f40'; ctx.lineWidth=10;
  ctx.beginPath(); ctx.moveTo(rx,portY); ctx.lineTo(rx+26,portY); ctx.lineTo(rx+26,portY-22); ctx.stroke();
  ctx.strokeStyle='#3a4455'; ctx.lineWidth=6;
  ctx.beginPath(); ctx.moveTo(rx,portY); ctx.lineTo(rx+26,portY); ctx.lineTo(rx+26,portY-22); ctx.stroke();
  // Exhaust puff
  if (stroke===3 && strokeT>0.25) {
    const al=(strokeT-0.25)*0.55;
    for(let i=0;i<4;i++){
      const t=((Date.now()*0.0009+i*0.3)%1);
      const px=rx+26; const py=portY-22-t*35;
      const r=3+t*18; const gr=ctx.createRadialGradient(px,py,0,px,py,r);
      gr.addColorStop(0,`rgba(140,150,160,${al*(1-t)})`); gr.addColorStop(1,'rgba(140,150,160,0)');
      ctx.fillStyle=gr; ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2); ctx.fill();
    }
  }
  // Intake air flow particles
  if (stroke===0 && strokeT>0.05 && strokeT<0.9) {
    const al=0.55*Math.sin(strokeT*Math.PI);
    for(let i=0;i<3;i++){
      const t=((Date.now()*0.0012+i*0.35)%1);
      const px=lx-26+(t*26); const py=portY-3+Math.sin(t*3)*4;
      const r=2.5; ctx.beginPath(); ctx.arc(px,py,r,0,Math.PI*2);
      ctx.fillStyle=`rgba(80,160,255,${al*(1-t*0.5)})`; ctx.fill();
    }
  }
}

function drawPiston(pistonTopY) {
  const px = CX-PISTON_W/2, py = pistonTopY;
  const g = ctx.createLinearGradient(px,py,px+PISTON_W,py);
  g.addColorStop(0,'#1e2838'); g.addColorStop(0.15,'#5a6880'); g.addColorStop(0.5,'#7a8ca0');
  g.addColorStop(0.85,'#4a5870'); g.addColorStop(1,'#1e2838');
  ctx.fillStyle = g; roundRect(px,py,PISTON_W,PISTON_H,3); ctx.fill();
  ctx.strokeStyle='#4a5870'; ctx.lineWidth=1; roundRect(px,py,PISTON_W,PISTON_H,3); ctx.stroke();
  // Rings
  [8,17,26].forEach(ro => {
    const ry=py+ro, rg=ctx.createLinearGradient(px,ry,px,ry+4);
    rg.addColorStop(0,'#8a9ab0'); rg.addColorStop(0.5,'#c0d0e0'); rg.addColorStop(1,'#4a5870');
    ctx.fillStyle=rg; ctx.fillRect(px-1,ry,PISTON_W+2,4);
    ctx.strokeStyle='#3a4860'; ctx.lineWidth=0.5; ctx.strokeRect(px-1,ry,PISTON_W+2,4);
  });
  // Pin
  ctx.beginPath(); ctx.arc(CX,py+PISTON_H*0.62,5,0,Math.PI*2);
  ctx.fillStyle='#1a2030'; ctx.fill(); ctx.strokeStyle='#3a4860'; ctx.lineWidth=1; ctx.stroke();
  // Crown highlight
  const cg=ctx.createLinearGradient(px,py,px+PISTON_W,py+6);
  cg.addColorStop(0,'rgba(255,255,255,0.05)'); cg.addColorStop(0.5,'rgba(255,255,255,0.13)'); cg.addColorStop(1,'rgba(255,255,255,0.02)');
  ctx.fillStyle=cg; ctx.fillRect(px+2,py+1,PISTON_W-4,5);
}

function drawConRod(wp, cp) {
  const dx=cp.x-wp.x, dy=cp.y-wp.y;
  const ang=Math.atan2(dy,dx), len=Math.sqrt(dx*dx+dy*dy);
  ctx.save(); ctx.translate(wp.x,wp.y); ctx.rotate(ang);
  const g=ctx.createLinearGradient(0,-6,0,6);
  g.addColorStop(0,'#1e2838'); g.addColorStop(0.35,'#5a6880'); g.addColorStop(0.5,'#7a8ca0'); g.addColorStop(0.65,'#4a5870'); g.addColorStop(1,'#1e2838');
  ctx.fillStyle=g; ctx.fillRect(0,-6,len,12);
  ctx.fillStyle='#6a7a90'; ctx.fillRect(0,-8,len,3); ctx.fillRect(0,5,len,3);
  ctx.fillStyle='#2a3a50'; ctx.fillRect(0,-2,len,4);
  ctx.restore();
  // Bearings
  [wp,cp].forEach((p,i)=>{
    const r=i===0?7:10;
    ctx.beginPath(); ctx.arc(p.x,p.y,r,0,Math.PI*2);
    const bg=ctx.createRadialGradient(p.x-2,p.y-2,0,p.x,p.y,r);
    bg.addColorStop(0,'#8a9ab0'); bg.addColorStop(1,'#2a3445');
    ctx.fillStyle=bg; ctx.fill(); ctx.strokeStyle='#5a6880'; ctx.lineWidth=1.5; ctx.stroke();
  });
}

function drawCrank(angle) {
  // Counterweights
  [0, Math.PI].forEach(off => {
    ctx.save(); ctx.translate(CX,CRANK_CY); ctx.rotate(angle+off+Math.PI);
    const g=ctx.createLinearGradient(-22,0,22,CRANK_R*0.85);
    g.addColorStop(0,'#2a3445'); g.addColorStop(0.5,'#4a5870'); g.addColorStop(1,'#1e2838');
    ctx.fillStyle=g; ctx.beginPath();
    ctx.moveTo(-18,0); ctx.lineTo(-22,CRANK_R*0.8); ctx.arc(0,CRANK_R*0.8,22,Math.PI,0); ctx.lineTo(18,0); ctx.closePath();
    ctx.fill(); ctx.strokeStyle='#3a4860'; ctx.lineWidth=1; ctx.stroke(); ctx.restore();
  });
  // Throw arm
  const cp=getCrankPin(angle);
  ctx.strokeStyle='#5a6880'; ctx.lineWidth=8; ctx.lineCap='round';
  ctx.beginPath(); ctx.moveTo(CX,CRANK_CY); ctx.lineTo(cp.x,cp.y); ctx.stroke();
  ctx.strokeStyle='#8a9ab0'; ctx.lineWidth=3;
  ctx.beginPath(); ctx.moveTo(CX,CRANK_CY); ctx.lineTo(cp.x,cp.y); ctx.stroke();
  // Main journal
  ctx.beginPath(); ctx.arc(CX,CRANK_CY,14,0,Math.PI*2);
  const mg=ctx.createRadialGradient(CX-4,CRANK_CY-4,0,CX,CRANK_CY,14);
  mg.addColorStop(0,'#8a9ab0'); mg.addColorStop(0.6,'#4a5870'); mg.addColorStop(1,'#1a2030');
  ctx.fillStyle=mg; ctx.fill(); ctx.strokeStyle='#5a6880'; ctx.lineWidth=2; ctx.stroke();
  ctx.beginPath(); ctx.arc(CX,CRANK_CY,4,0,Math.PI*2); ctx.fillStyle='#1e2838'; ctx.fill();
  // Rotation tick
  ctx.save(); ctx.translate(CX,CRANK_CY); ctx.rotate(angle);
  ctx.strokeStyle='rgba(74,240,200,0.65)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(0,-12); ctx.stroke(); ctx.restore();
}

function drawSump() {
  const lx=CX-72, rx=CX+72, ty=CRANK_CY+38, by=H-6;
  const g=ctx.createLinearGradient(lx,ty,rx,by);
  g.addColorStop(0,'#1a2230'); g.addColorStop(0.5,'#2a3448'); g.addColorStop(1,'#1a2230');
  ctx.fillStyle=g; roundRect(lx,ty,rx-lx,by-ty,6); ctx.fill();
  ctx.strokeStyle='#2a3448'; ctx.lineWidth=1.5; roundRect(lx,ty,rx-lx,by-ty,6); ctx.stroke();
  ctx.fillStyle='rgba(40,160,120,0.1)'; ctx.fillRect(lx+4,ty+6,rx-lx-8,8);
}

function drawLabel(stroke) {
  const labels=['INTAKE','COMPRESSION','POWER','EXHAUST'];
  const colors=['#3a9fff','#aabbcc','#ff8c00','#8a9aa0'];
  ctx.font='700 11px "Share Tech Mono"'; ctx.textAlign='center';
  ctx.fillStyle=colors[stroke]; ctx.shadowColor=colors[stroke]; ctx.shadowBlur=14;
  ctx.fillText(labels[stroke],CX,H-12); ctx.shadowBlur=0;
}

function setGauge(id, pct, labelId) {
  const box=document.getElementById(id); if(!box)return;
  box.querySelector('.gauge-fill').style.width=pct+'%';
  document.getElementById(labelId).textContent=pct+'%';
}
function updateUI(stroke, strokeT) {
  document.querySelectorAll('.stroke-item').forEach(el=>el.classList.toggle('active',parseInt(el.dataset.s)===stroke));
  document.getElementById('rpmDisp').textContent=Math.round(rpm);
  const rpmPct=Math.round((rpm-200)/(3600-200)*100);
  const presPct=stroke===1?Math.round(strokeT*100):stroke===2?Math.round((1-strokeT)*88):0;
  const tempPct=stroke===2?Math.round(68+(1-strokeT)*32):stroke===1?Math.round(strokeT*42):stroke===3?Math.round((1-strokeT)*52):5;
  setGauge('gRpm',rpmPct,'lRpm'); setGauge('gPres',presPct,'lPres'); setGauge('gTemp',tempPct,'lTemp');
}

function frame(ts) {
  if (!lastTs) lastTs=ts;
  const dt=Math.min((ts-lastTs)/1000,0.05); lastTs=ts;
  crankAngle += (rpm/60)*2*Math.PI*dt;
  const pistonTopY=getPistonY(crankAngle);
  const wp=getWristPin(pistonTopY), cp=getCrankPin(crankAngle);
  const stroke=getStroke(), strokeT=getStrokeT();
  drawBG(); drawSump(); drawPorts(stroke,strokeT);
  drawGas(pistonTopY,stroke,strokeT); drawBlock(); drawHead(stroke,strokeT);
  drawValves(stroke,strokeT); drawCrank(crankAngle); drawConRod(wp,cp);
  drawPiston(pistonTopY); drawLabel(stroke); updateUI(stroke,strokeT);
  requestAnimationFrame(frame);
}

document.getElementById('speedSlider').addEventListener('input',function(){
  rpm=parseInt(this.value); document.getElementById('spdVal').textContent=rpm+' rpm';
});
requestAnimationFrame(frame);
</script>
