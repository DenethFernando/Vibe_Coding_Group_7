<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nothing But Net</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --court: #F5EDD8;
    --wood-line: #D9C89E;
    --ball-orange: #E8621A;
    --ball-dark: #C24E0E;
    --ball-seam: #8B2E00;
    --rim: #E03A1E;
    --rim-dark: #AA2210;
    --net: #D0C8B8;
    --board: #EAF0F6;
    --board-border: #B8C8D8;
    --shadow: rgba(80, 50, 20, 0.18);
    --text: #3A2A18;
  }

  body {
    background: var(--court);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    font-family: 'DM Sans', sans-serif;
    overflow: hidden;
    position: relative;
  }

  /* Court floor lines */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      repeating-linear-gradient(90deg, transparent, transparent 119px, var(--wood-line) 119px, var(--wood-line) 120px),
      linear-gradient(180deg, #F7F0DF 0%, #EFE3C2 100%);
    z-index: 0;
    pointer-events: none;
  }

  /* Three-point arc suggestion */
  body::after {
    content: '';
    position: fixed;
    bottom: -60px;
    left: 50%;
    transform: translateX(-50%);
    width: 700px;
    height: 350px;
    border: 2px solid var(--wood-line);
    border-radius: 350px 350px 0 0;
    z-index: 0;
    pointer-events: none;
  }

  .title {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    color: var(--text);
    letter-spacing: 0.12em;
    position: relative;
    z-index: 10;
    margin-bottom: 10px;
    opacity: 0.85;
  }

  .subtitle {
    font-size: 0.75rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--ball-dark);
    position: relative;
    z-index: 10;
    margin-bottom: 40px;
    opacity: 0.7;
  }

  .scene {
    position: relative;
    width: 620px;
    height: 420px;
    z-index: 5;
  }

  /* ── BACKBOARD ── */
  .backboard {
    position: absolute;
    right: 60px;
    top: 20px;
    width: 110px;
    height: 76px;
    background: var(--board);
    border: 3px solid var(--board-border);
    border-radius: 3px;
    box-shadow: 3px 3px 0 var(--board-border), 6px 6px 18px rgba(0,0,0,0.10);
  }

  .backboard::after {
    content: '';
    position: absolute;
    top: 18px;
    left: 50%;
    transform: translateX(-50%);
    width: 50px;
    height: 36px;
    border: 2.5px solid var(--rim);
    border-radius: 2px;
  }

  /* Backboard pole */
  .pole {
    position: absolute;
    right: 109px;
    top: 96px;
    width: 8px;
    height: 140px;
    background: linear-gradient(90deg, #bbbfca, #d5d8df, #b0b4be);
    border-radius: 2px;
    box-shadow: 1px 0 4px rgba(0,0,0,0.1);
  }

  /* ── RIM ── */
  .rim-wrap {
    position: absolute;
    right: 72px;
    top: 95px;
  }

  .rim {
    position: relative;
    width: 80px;
    height: 14px;
  }

  /* Front rim bar */
  .rim::before {
    content: '';
    position: absolute;
    left: 0;
    top: 4px;
    width: 80px;
    height: 10px;
    background: linear-gradient(180deg, var(--rim) 60%, var(--rim-dark));
    border-radius: 5px;
    box-shadow: 0 3px 8px rgba(0,0,0,0.22), inset 0 -2px 4px rgba(0,0,0,0.15);
    z-index: 4;
  }

  /* Back rim connector to board */
  .rim::after {
    content: '';
    position: absolute;
    right: -2px;
    top: 6px;
    width: 14px;
    height: 6px;
    background: var(--rim-dark);
    border-radius: 2px;
    z-index: 3;
  }

  /* ── NET ── */
  .net {
    position: absolute;
    left: 4px;
    top: 13px;
    width: 72px;
    height: 54px;
    overflow: hidden;
    z-index: 2;
  }

  .net svg {
    width: 100%;
    height: 100%;
  }

  /* ── BALL ── */
  .ball {
    position: absolute;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    background: radial-gradient(circle at 35% 32%, #F58C42 0%, var(--ball-orange) 45%, var(--ball-dark) 100%);
    box-shadow:
      inset -6px -6px 14px rgba(0,0,0,0.28),
      inset 3px 3px 8px rgba(255,220,160,0.30),
      0 6px 20px rgba(180,80,20,0.28);
    z-index: 6;
    will-change: transform;
  }

  /* Ball seam lines via pseudo + SVG overlay */
  .ball::before {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 50%;
    background:
      /* horizontal seam */
      radial-gradient(ellipse 100% 12% at 50% 50%, transparent 60%, var(--ball-seam) 60%, var(--ball-seam) 63%, transparent 63%),
      /* vertical seam */
      radial-gradient(ellipse 12% 100% at 50% 50%, transparent 60%, var(--ball-seam) 60%, var(--ball-seam) 63%, transparent 63%);
    opacity: 0.55;
  }

  /* curved seam lines */
  .ball-seams {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    overflow: hidden;
  }

  .ball-seams svg {
    width: 100%;
    height: 100%;
  }

  /* ── BALL SHADOW ── */
  .ball-shadow {
    position: absolute;
    bottom: 8px;
    left: 50%;
    width: 50px;
    height: 12px;
    background: radial-gradient(ellipse, rgba(80,40,10,0.35) 0%, transparent 75%);
    border-radius: 50%;
    transform: translateX(-50%);
    z-index: 1;
    will-change: transform, opacity;
  }

  /* ── SWISH FLASH ── */
  .swish {
    position: absolute;
    right: 60px;
    top: 82px;
    width: 80px;
    height: 30px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    color: var(--ball-dark);
    opacity: 0;
    z-index: 20;
    pointer-events: none;
  }

  /* score counter */
  .score-area {
    position: relative;
    z-index: 10;
    margin-top: 32px;
    display: flex;
    align-items: baseline;
    gap: 12px;
  }

  .score-label {
    font-size: 0.65rem;
    letter-spacing: 0.3em;
    text-transform: uppercase;
    color: var(--text);
    opacity: 0.5;
  }

  .score-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 3.5rem;
    color: var(--text);
    line-height: 1;
    opacity: 0.85;
    transition: transform 0.15s cubic-bezier(.3,1.6,.5,1);
  }

  .score-num.pop {
    transform: scale(1.35);
  }
</style>
</head>
<body>

<p class="title">Nothing But Net</p>
<p class="subtitle">Free throw &nbsp;·&nbsp; Perfect arc</p>

<div class="scene" id="scene">

  <!-- Backboard & pole -->
  <div class="pole"></div>
  <div class="backboard"></div>

  <!-- Rim -->
  <div class="rim-wrap" id="rimWrap">
    <div class="rim">
      <!-- Net SVG -->
      <div class="net">
        <svg viewBox="0 0 72 54" fill="none" xmlns="http://www.w3.org/2000/svg" id="netSvg">
          <!-- Net drawn as tapering mesh lines -->
          <!-- Vertical strands -->
          <line x1="6"  y1="0" x2="2"  y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="14" y1="0" x2="10" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="22" y1="0" x2="18" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="30" y1="0" x2="27" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="36" y1="0" x2="36" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="42" y1="0" x2="45" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="50" y1="0" x2="54" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="58" y1="0" x2="62" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <line x1="66" y1="0" x2="70" y2="54" stroke="#C0B8A8" stroke-width="1.2" opacity="0.7"/>
          <!-- Horizontal rows — slightly curved via quadratic bezier -->
          <path d="M4 7 Q36 10 68 7"   stroke="#C0B8A8" stroke-width="1.1" fill="none" opacity="0.65"/>
          <path d="M3 16 Q36 20 69 16" stroke="#C0B8A8" stroke-width="1.1" fill="none" opacity="0.65"/>
          <path d="M3 26 Q36 31 69 26" stroke="#C0B8A8" stroke-width="1.1" fill="none" opacity="0.6"/>
          <path d="M4 37 Q36 43 68 37" stroke="#C0B8A8" stroke-width="1.1" fill="none" opacity="0.55"/>
          <path d="M6 48 Q36 54 66 48" stroke="#C0B8A8" stroke-width="1.0" fill="none" opacity="0.5"/>
          <!-- Net bottom fringe -->
          <path d="M8 54 Q18 60 28 54" stroke="#C0B8A8" stroke-width="1.0" fill="none" opacity="0.45"/>
          <path d="M28 54 Q38 60 48 54" stroke="#C0B8A8" stroke-width="1.0" fill="none" opacity="0.45"/>
          <path d="M48 54 Q58 60 68 54" stroke="#C0B8A8" stroke-width="1.0" fill="none" opacity="0.45"/>
        </svg>
      </div>
    </div>
  </div>

  <!-- Ball shadow on floor -->
  <div class="ball-shadow" id="ballShadow"></div>

  <!-- Basketball -->
  <div class="ball" id="ball">
    <div class="ball-seams">
      <svg viewBox="0 0 46 46" fill="none" xmlns="http://www.w3.org/2000/svg">
        <!-- Left curved seam -->
        <path d="M10 4 C2 14, 2 32, 10 42" stroke="#7A2400" stroke-width="1.6" fill="none" opacity="0.6"/>
        <!-- Right curved seam -->
        <path d="M36 4 C44 14, 44 32, 36 42" stroke="#7A2400" stroke-width="1.6" fill="none" opacity="0.6"/>
        <!-- Top curved seam -->
        <path d="M4 14 C14 6, 32 6, 42 14" stroke="#7A2400" stroke-width="1.6" fill="none" opacity="0.6"/>
        <!-- Bottom curved seam -->
        <path d="M4 32 C14 40, 32 40, 42 32" stroke="#7A2400" stroke-width="1.6" fill="none" opacity="0.6"/>
      </svg>
    </div>
  </div>

  <!-- Swish text -->
  <div class="swish" id="swish">SWISH</div>

</div>

<div class="score-area">
  <span class="score-label">Points</span>
  <span class="score-num" id="scoreNum">00</span>
</div>

<script>
(() => {
  const ball       = document.getElementById('ball');
  const shadow     = document.getElementById('ballShadow');
  const swishEl    = document.getElementById('swish');
  const scoreEl    = document.getElementById('scoreNum');
  const scene      = document.getElementById('scene');

  // Scene dimensions
  const SW = 620, SH = 420;

  // Rim center (matches CSS: right:72px from 620 wide, top:95+7=102 center)
  const rimCX  = SW - 72 - 40;   // ~508  → left edge of rim is SW-72-80 = 468; center = 468+40 = 508
  const rimCY  = 102;             // vertical center of rim
  const rimR   = 40;              // half rim width (80px total)
  const ballR  = 23;              // ball radius (46/2)

  // Ball start position (lower-left)
  const startX = 55,  startY = 355;

  // Target: center of the rim opening
  const targetX = rimCX, targetY = rimCY;

  // Physics params
  const DURATION  = 1380;   // ms for one arc phase
  const SETTLE    = 420;    // ms for ball to fall through net
  const PAUSE     = 520;    // ms pause before reset
  const TOTAL     = DURATION + SETTLE + PAUSE;

  // Gravity arc: parabola peak
  const peakX = (startX + targetX * 0.55);
  const peakY = 30;

  let score = 0;
  let startTime = null;
  let phase = 'arc'; // 'arc' | 'settle' | 'pause'
  let phaseStart = null;
  let scored = false;
  let raf;

  // Shadow floor Y (bottom of scene-ish)
  const floorY = SH - 18;

  function easeInOutCubic(t) {
    return t < 0.5 ? 4*t*t*t : 1 - Math.pow(-2*t+2,3)/2;
  }

  function easeOutQuad(t) { return 1-(1-t)*(1-t); }
  function easeInQuad(t)  { return t*t; }

  function quadBezier(t, p0, p1, p2) {
    return (1-t)*(1-t)*p0 + 2*(1-t)*t*p1 + t*t*p2;
  }

  function setBall(x, y, scale=1, rot=0) {
    ball.style.transform  = `translate(${x - ballR}px, ${y - ballR}px) rotate(${rot}deg) scale(${scale})`;
  }

  function setShadow(bx, by) {
    // Shadow shrinks and fades as ball rises, grows as it falls
    const dist = floorY - by;
    const maxDist = floorY - peakY;
    const t = 1 - Math.min(dist / maxDist, 1);
    const scaleX = 0.45 + 0.55 * t;
    const opacity = 0.12 + 0.25 * t;
    shadow.style.transform = `translateX(calc(${bx}px - 50%)) scaleX(${scaleX})`;
    shadow.style.opacity   = opacity;
    // Move shadow horizontally with ball
    shadow.style.left = '0';
    shadow.style.bottom = '8px';
  }

  function showSwish() {
    swishEl.style.transition = 'none';
    swishEl.style.opacity = '1';
    swishEl.style.transform = 'scale(1.1)';
    setTimeout(() => {
      swishEl.style.transition = 'opacity 0.6s ease, transform 0.6s ease';
      swishEl.style.opacity = '0';
      swishEl.style.transform = 'scale(0.85) translateY(-8px)';
    }, 420);
  }

  function bumpScore() {
    score += 2;
    scoreEl.textContent = String(score).padStart(2,'0');
    scoreEl.classList.remove('pop');
    void scoreEl.offsetWidth;
    scoreEl.classList.add('pop');
    setTimeout(()=> scoreEl.classList.remove('pop'), 200);
  }

  function animate(ts) {
    if (!startTime) startTime = ts;
    const elapsed = ts - startTime;

    if (phase === 'arc') {
      const t = Math.min(elapsed / DURATION, 1);

      // Parabolic path via quadratic bezier with peak control point
      const bx = quadBezier(t, startX, peakX, targetX);
      const by = quadBezier(t, startY, peakY, targetY);

      // Spin increases as ball travels
      const rot = t * 380;

      // Scale: slight grow at peak
      const scale = 1 + 0.12 * Math.sin(Math.PI * t);

      setBall(bx, by, scale, rot);
      setShadow(bx, by);

      if (t >= 1) {
        phase = 'settle';
        phaseStart = ts;
        if (!scored) {
          scored = true;
          showSwish();
          bumpScore();
        }
      }
    } else if (phase === 'settle') {
      const t = Math.min((ts - phaseStart) / SETTLE, 1);
      // Ball falls straight down through net
      const fallY = targetY + t * 58;
      const shrink = 1 - t * 0.22; // slight shrink as it goes through
      setBall(targetX, fallY, shrink, 380 + t*60);
      setShadow(targetX, fallY);

      if (t >= 1) {
        phase = 'pause';
        phaseStart = ts;
      }
    } else if (phase === 'pause') {
      const t = (ts - phaseStart) / PAUSE;
      if (t >= 1) {
        // reset
        phase = 'arc';
        startTime = ts;
        scored = false;
        setBall(startX, startY, 1, 0);
        setShadow(startX, startY);
      }
    }

    raf = requestAnimationFrame(animate);
  }

  // Init position
  setBall(startX, startY, 1, 0);
  setShadow(startX, startY);

  raf = requestAnimationFrame(animate);
})();
</script>
</body>
</html>
