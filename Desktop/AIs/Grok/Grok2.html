<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grok • 4-Stroke Engine</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600&amp;display=swap');
        
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(180deg, #0f172a 0%, #1e2937 100%);
            font-family: 'Inter', system_ui, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            color: #e2e8f0;
            overflow: hidden;
        }
        
        .container {
            position: relative;
            width: 860px;
            background: #1e2937;
            border-radius: 28px;
            box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6);
            overflow: hidden;
        }
        
        .header {
            position: absolute;
            top: 24px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 22px;
            font-weight: 600;
            letter-spacing: -0.8px;
            color: #f8fafc;
            z-index: 20;
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.4);
        }
        
        svg {
            display: block;
            background: #0f172a;
        }
        
        .phase {
            position: absolute;
            bottom: 32px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 18px;
            font-weight: 600;
            letter-spacing: 1.5px;
            padding: 8px 32px;
            border-radius: 9999px;
            background: rgba(15, 23, 42, 0.85);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.3);
            z-index: 20;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .footer {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 12px;
            color: #64748b;
            z-index: 20;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">4-STROKE PISTON ENGINE</div>
        
        <svg id="engine" width="860" height="620" viewBox="0 0 860 620" xmlns="http://www.w3.org/2000/svg">
            <!-- Cylinder block -->
            <rect x="310" y="85" width="240" height="390" rx="18" fill="#334155" stroke="#1e2937" stroke-width="28"/>
            <!-- Cylinder bore -->
            <rect x="340" y="105" width="180" height="360" rx="8" fill="#0f172a" stroke="#64748b" stroke-width="14"/>
            
            <!-- Cylinder head -->
            <rect x="305" y="68" width="250" height="48" rx="12" fill="#475569" stroke="#1e2937" stroke-width="16"/>
            
            <!-- Intake port -->
            <path d="M305 98 L240 98 Q210 98 210 130" fill="none" stroke="#3b82f6" stroke-width="26" stroke-linecap="round"/>
            <!-- Exhaust port -->
            <path d="M555 98 L630 98 Q660 98 660 130" fill="none" stroke="#64748b" stroke-width="26" stroke-linecap="round"/>
            
            <!-- Labels -->
            <text x="170" y="115" fill="#60a5fa" font-size="15" font-weight="600" text-anchor="middle">INTAKE</text>
            <text x="700" y="115" fill="#94a3b8" font-size="15" font-weight="600" text-anchor="middle">EXHAUST</text>
            
            <!-- Spark plug -->
            <g>
                <!-- Plug body -->
                <rect x="405" y="42" width="18" height="38" rx="4" fill="#475569" stroke="#1e2937" stroke-width="6"/>
                <!-- Electrode -->
                <rect x="410" y="35" width="8" height="12" fill="#f1f5f9"/>
                <!-- Spark gap line (flashes later) -->
                <line id="spark" x1="414" y1="47" x2="414" y2="58" stroke="#facc15" stroke-width="3" stroke-linecap="round" opacity="0"/>
            </g>
            
            <!-- Intake valve -->
            <g id="intake-valve">
                <!-- Valve stem -->
                <rect x="335" y="72" width="14" height="58" rx="7" fill="#64748b" stroke="#1e2937" stroke-width="4"/>
                <!-- Valve head -->
                <ellipse cx="342" cy="118" rx="26" ry="9" fill="#334155" stroke="#1e2937" stroke-width="5"/>
            </g>
            
            <!-- Exhaust valve -->
            <g id="exhaust-valve">
                <!-- Valve stem -->
                <rect x="511" y="72" width="14" height="58" rx="7" fill="#64748b" stroke="#1e2937" stroke-width="4"/>
                <!-- Valve head -->
                <ellipse cx="518" cy="118" rx="26" ry="9" fill="#334155" stroke="#1e2937" stroke-width="5"/>
            </g>
            
            <!-- Gas layer (above piston) -->
            <rect id="gas" x="350" y="115" width="160" height="200" rx="6" fill="#3b82f6" opacity="0.28"/>
            
            <!-- Flame (combustion) -->
            <g id="flame" opacity="0">
                <!-- Outer flame -->
                <path d="M400 135 Q375 165 385 185 Q400 175 415 190 Q425 160 400 135" fill="#f97316"/>
                <!-- Inner flame -->
                <path d="M400 140 Q382 155 390 170 Q400 165 410 175 Q418 155 400 140" fill="#fbbf24"/>
                <!-- Bright core -->
                <path d="M400 145 Q390 152 395 160 Q400 155 405 158" fill="#fef08c"/>
            </g>
            
            <!-- Intake flow path -->
            <path id="intake-flow" d="M250 105 Q290 105 325 105" fill="none" stroke="#60a5fa" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 12" opacity="0"/>
            
            <!-- Exhaust flow path -->
            <path id="exhaust-flow" d="M535 105 Q575 105 620 105" fill="none" stroke="#94a3b8" stroke-width="7" stroke-linecap="round" stroke-dasharray="18 12" opacity="0"/>
            
            <!-- Crankshaft assembly -->
            <!-- Main bearing -->
            <circle cx="400" cy="520" r="42" fill="#1e2937" stroke="#475569" stroke-width="18"/>
            <!-- Crank arm -->
            <line id="crank-arm" x1="400" y1="520" x2="400" y2="455" stroke="#cbd5e1" stroke-width="26" stroke-linecap="round"/>
            <!-- Crank pin bearing -->
            <circle id="crank-pin" r="14" fill="#1e2937" stroke="#64748b" stroke-width="6"/>
            
            <!-- Connecting rod -->
            <line id="connecting-rod" x1="400" y1="455" x2="400" y2="280" stroke="#cbd5e1" stroke-width="18" stroke-linecap="round"/>
            <!-- Rod big end bearing -->
            <circle id="rod-big" r="13" fill="#1e2937"/>
            <!-- Rod small end bearing -->
            <circle id="rod-small" r="11" fill="#1e2937"/>
            
            <!-- Piston group -->
            <g id="piston">
                <!-- Piston body -->
                <rect x="0" y="0" width="130" height="72" rx="8" fill="#e2e8f0" stroke="#1e2937" stroke-width="9"/>
                <!-- Piston rings -->
                <rect x="8" y="12" width="114" height="6" fill="#475569"/>
                <rect x="8" y="28" width="114" height="6" fill="#475569"/>
                <!-- Wrist pin -->
                <rect x="58" y="48" width="14" height="22" rx="4" fill="#1e2937"/>
            </g>
            
            <!-- Phase label inside SVG -->
            <text id="phase-text" x="430" y="38" font-size="19" font-weight="700" fill="#f1f5f9" text-anchor="middle" font-family="Space Grotesk" letter-spacing="1px">INTAKE</text>
        </svg>
        
        <div id="phase-display" class="phase">INTAKE</div>
        <div class="footer">Accurate kinematics • 720° cycle • Real-time physics</div>
    </div>

    <script>
        const svg = document.getElementById('engine')
        
        // Elements
        const piston = document.getElementById('piston')
        const crankArm = document.getElementById('crank-arm')
        const crankPinCircle = document.getElementById('crank-pin')
        const connectingRod = document.getElementById('connecting-rod')
        const rodBig = document.getElementById('rod-big')
        const rodSmall = document.getElementById('rod-small')
        const gas = document.getElementById('gas')
        const flame = document.getElementById('flame')
        const spark = document.getElementById('spark')
        const intakeValve = document.getElementById('intake-valve')
        const exhaustValve = document.getElementById('exhaust-valve')
        const intakeFlow = document.getElementById('intake-flow')
        const exhaustFlow = document.getElementById('exhaust-flow')
        const phaseText = document.getElementById('phase-text')
        const phaseDisplay = document.getElementById('phase-display')
        
        // Engine dimensions
        const boreCenterX = 400
        const crankCenterX = 400
        const crankCenterY = 520
        const crankRadius = 68
        const rodLength = 198
        const pistonWidth = 130
        const pistonHeight = 72
        const pistonPinOffsetFromTop = 38   // wrist pin position inside piston
        
        let theta = 0          // degrees, 0–720 for full cycle
        let frame = 0
        const speed = 1.85     // degrees per frame (~6.7s per full cycle at 60fps)
        
        function updateEngine() {
            theta = (theta + speed) % 720
            const rad = theta * Math.PI / 180
            
            // Crank pin position
            const crankPinX = crankCenterX + crankRadius * Math.sin(rad)
            const crankPinY = crankCenterY - crankRadius * Math.cos(rad)
            
            // Wrist pin (piston pin) position
            const dx = crankPinX - boreCenterX
            const wristPinY = crankPinY - Math.sqrt(rodLength * rodLength - dx * dx)
            
            // Piston top position
            const pistonTopY = wristPinY - pistonPinOffsetFromTop
            
            // Update crank arm
            crankArm.setAttribute('x2', crankPinX)
            crankArm.setAttribute('y2', crankPinY)
            
            // Update crank pin circle
            crankPinCircle.setAttribute('cx', crankPinX)
            crankPinCircle.setAttribute('cy', crankPinY)
            
            // Update connecting rod
            connectingRod.setAttribute('x1', crankPinX)
            connectingRod.setAttribute('y1', crankPinY)
            connectingRod.setAttribute('x2', boreCenterX)
            connectingRod.setAttribute('y2', wristPinY)
            
            // Update rod bearings
            rodBig.setAttribute('cx', crankPinX)
            rodBig.setAttribute('cy', crankPinY)
            rodSmall.setAttribute('cx', boreCenterX)
            rodSmall.setAttribute('cy', wristPinY)
            
            // Update piston
            piston.setAttribute('transform', `translate(${boreCenterX - pistonWidth/2} ${pistonTopY})`)
            
            // Cycle phase (0°–720°)
            let phase = ''
            let gasColor = '#64748b'
            let gasOpacity = 0.12
            let showFlame = false
            let showSpark = false
            let intakeOpen = 0
            let exhaustOpen = 0
            
            if (theta < 180) {
                phase = 'INTAKE'
                gasColor = '#3b82f6'
                gasOpacity = 0.32
                intakeOpen = 17
                intakeFlow.setAttribute('opacity', '0.85')
            } 
            else if (theta < 360) {
                phase = 'COMPRESSION'
                gasColor = '#64748b'
                gasOpacity = 0.14
            } 
            else if (theta < 540) {
                phase = 'POWER'
                gasColor = '#f59e0b'
                gasOpacity = 0.38
                showFlame = true
                // Spark ~5° before TDC of power stroke
                if (Math.abs(theta - 360) < 8) showSpark = true
            } 
            else {
                phase = 'EXHAUST'
                gasColor = '#94a3b8'
                gasOpacity = 0.28
                exhaustOpen = 17
                exhaustFlow.setAttribute('opacity', '0.85')
            }
            
            // Update gas layer (above piston)
            const gasTop = 115
            const gasHeight = Math.max(8, pistonTopY - gasTop)
            gas.setAttribute('y', gasTop)
            gas.setAttribute('height', gasHeight)
            gas.setAttribute('fill', gasColor)
            gas.setAttribute('opacity', gasOpacity)
            
            // Flame
            flame.setAttribute('opacity', showFlame ? '0.95' : '0')
            
            // Spark flash
            spark.setAttribute('opacity', showSpark ? '1' : '0')
            
            // Valves
            intakeValve.setAttribute('transform', `translate(0 ${intakeOpen})`)
            exhaustValve.setAttribute('transform', `translate(0 ${exhaustOpen})`)
            
            // Flow animation
            const dashOffset = (frame * 3.5) % 60
            if (theta < 180) {
                intakeFlow.setAttribute('stroke-dashoffset', dashOffset)
            } else {
                intakeFlow.setAttribute('opacity', '0')
            }
            if (theta > 540) {
                exhaustFlow.setAttribute('stroke-dashoffset', -dashOffset)
            } else {
                exhaustFlow.setAttribute('opacity', '0')
            }
            
            // Update phase labels
            phaseText.textContent = phase
            phaseDisplay.textContent = phase
            phaseDisplay.style.color = (phase === 'POWER') ? '#fbbf24' : 
                                      (phase === 'INTAKE') ? '#60a5fa' : 
                                      (phase === 'EXHAUST') ? '#94a3b8' : '#cbd5e1'
            
            frame++
            requestAnimationFrame(updateEngine)
        }
        
        // Start animation
        updateEngine()
        
        // Click to speed up temporarily (fun interaction)
        svg.addEventListener('click', () => {
            const originalSpeed = speed
            let boost = 4.5
            const interval = setInterval(() => {
                boost *= 0.92
                if (boost < 0.2) {
                    clearInterval(interval)
                }
            }, 40)
        })
    </script>
</body>
</html>
