<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Grok • Wrench Tightening Bolt</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>

<style>
  body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #1e293b 0%, #111827 100%);
    font-family: system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .scene {
    position: relative;
    width:  720px;
    height: 480px;
    perspective: 1400px;
  }

  svg {
    width: 100%;
    height: 100%;
    filter: drop-shadow(0 25px 35px rgba(0,0,0,0.55));
  }

  .title {
    position: absolute;
    top: 28px;
    left: 50%;
    transform: translateX(-50%);
    color: #e2e8f0;
    font-size: 1.9rem;
    font-weight: 600;
    letter-spacing: -0.5px;
    text-shadow: 0 3px 12px rgba(0,0,0,0.6);
    z-index: 10;
    pointer-events: none;
  }

  .status {
    position: absolute;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: rgba(30, 41, 59, 0.75);
    color: #94a3b8;
    padding: 8px 22px;
    border-radius: 999px;
    font-size: 0.92rem;
    backdrop-filter: blur(6px);
    box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    z-index: 10;
  }
</style>
</head>
<body>

<div class="scene">
  <div class="title">Wrench Tightening</div>

  <svg viewBox="0 0 720 480" xmlns="http://www.w3.org/2000/svg">
    <!-- Background gradient plane -->
    <rect width="720" height="480" fill="url(#bgGrad)"/>
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#1e293b"/>
        <stop offset="100%" stop-color="#0f172a"/>
      </linearGradient>

      <!-- Metal gradient -->
      <linearGradient id="steel" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#e2e8f0"/>
        <stop offset="15%"  stop-color="#cbd5e1"/>
        <stop offset="40%"  stop-color="#94a3b8"/>
        <stop offset="60%"  stop-color="#64748b"/>
        <stop offset="85%"  stop-color="#475569"/>
        <stop offset="100%" stop-color="#334155"/>
      </linearGradient>

      <linearGradient id="steelDark" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%"   stop-color="#94a3b8"/>
        <stop offset="30%"  stop-color="#64748b"/>
        <stop offset="70%"  stop-color="#475569"/>
        <stop offset="100%" stop-color="#334155"/>
      </linearGradient>

      <radialGradient id="highlight" cx="30%" cy="30%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.45)"/>
        <stop offset="100%" stop-color="rgba(255,255,255,0)"/>
      </radialGradient>
    </defs>

    <!-- Shadow under objects -->
    <ellipse cx="360" cy="420" rx="180" ry="28" fill="rgba(0,0,0,0.45)" opacity="0.7"/>

    <!-- Threaded bolt (fixed) -->
    <g id="bolt" transform="translate(360,240)">
      <!-- Bolt head (hex) -->
      <g transform="rotate(30)">
        <polygon points="0,-38 33,-19 33,19 0,38 -33,19 -33,-19" fill="url(#steelDark)" stroke="#1e293b" stroke-width="5"/>
        <polygon points="0,-32 28,-16 28,16 0,32 -28,16 -28,-16" fill="url(#steel)" stroke="#475569" stroke-width="3"/>
      </g>

      <!-- Threaded shaft -->
      <g transform="translate(0,38)">
        <rect x="-14" y="0" width="28" height="160" fill="#334155"/>
        <!-- threads -->
        <path d="M-14,10  h28 M-14,30 h28 M-14,50 h28 M-14,70 h28 M-14,90 h28 M-14,110 h28 M-14,130 h28 M-14,150 h28"
              stroke="#475569" stroke-width="3.5" stroke-linecap="round"/>
        <path d="M-10,0  l-8,20 M10,0  l8,20 M-10,40 l-8,20 M10,40 l8,20 M-10,80 l-8,20 M10,80 l8,20 M-10,120 l-8,20 M10,120 l8,20"
              stroke="#1e293b" stroke-width="4.5" opacity="0.7"/>
      </g>
    </g>

    <!-- Nut (moving up the thread) -->
    <g id="nut">
      <g transform="translate(360,360)">
        <!-- Hex nut body -->
        <g id="nut-body" transform="rotate(0)">
          <polygon points="0,-26 22.5,-13 22.5,13 0,26 -22.5,13 -22.5,-13" fill="url(#steel)" stroke="#1e293b" stroke-width="5.5"/>
          <polygon points="0,-20 17,-10 17,10 0,20 -17,10 -17,-10" fill="#475569" opacity="0.9"/>
          <!-- Inner thread hole (simplified) -->
          <circle cx="0" cy="0" r="9" fill="#1e293b"/>
        </g>
      </g>
    </g>

    <!-- Adjustable wrench -->
    <g id="wrench">
      <g transform="translate(220,220) rotate(15)">
        <!-- Handle -->
        <rect x="-18" y="-140" width="36" height="280" rx="18" fill="url(#steelDark)" stroke="#1e293b" stroke-width="6"/>

        <!-- Jaw fixed part -->
        <rect x="0" y="-55" width="90" height="40" rx="6" fill="url(#steel)" stroke="#1e293b" stroke-width="5.5"/>

        <!-- Movable jaw (slight gap) -->
        <g transform="translate(0,12)">
          <rect x="0" y="-55" width="90" height="28" rx="5" fill="url(#steel)" stroke="#1e293b" stroke-width="5"/>
        </g>

        <!-- Adjustment screw / worm gear (simplified) -->
        <circle cx="45" cy="-35" r="11" fill="#334155" stroke="#1e293b" stroke-width="4"/>
        <path d="M45,-46 v22 M34,-35 h22" stroke="#475569" stroke-width="5" stroke-linecap="round"/>

        <!-- Shine highlight -->
        <rect x="-12" y="-130" width="24" height="240" fill="url(#highlight)" opacity="0.35"/>
      </g>
    </g>

    <!-- Small sparks during tightening (occasional) -->
    <g id="sparks" opacity="0">
      <circle cx="460" cy="340" r="3" fill="#fef08c"/>
      <circle cx="465" cy="328" r="2.5" fill="#fbbf24"/>
      <circle cx="452" cy="335" r="2" fill="#facc15"/>
    </g>

  </svg>

  <div class="status">Tightening • Clockwise rotation</div>
</div>

<script>
const nut = document.getElementById('nut');
const nutBody = document.getElementById('nut-body');
const wrench = document.getElementById('wrench');
const sparks = document.getElementById('sparks');

let angle = 0;
let nutY = 360;
let tightening = true;
const maxTravel = 120; // how far nut moves up

function animate() {
  angle += 2.4;           // wrench rotation speed
  if (angle > 360) angle -= 360;

  // Nut moves upward slowly while wrench turns
  if (tightening) {
    nutY -= 0.28;         // upward movement per frame
    if (nutY < 360 - maxTravel) {
      tightening = false; // reached top → reverse for demo loop
    }
  } else {
    nutY += 0.22;
    if (nutY > 360) {
      tightening = true;
      nutY = 360;
    }
  }

  // Wrench oscillates slightly while turning (realistic hand motion)
  const wrenchOsc = Math.sin(angle * 0.12) * 6;

  wrench.setAttribute('transform',
    `translate(220,220) rotate(${angle + wrenchOsc})`
  );

  // Nut follows thread (rotates slightly less than wrench)
  nut.setAttribute('transform',
    `translate(360,${nutY})`
  );
  nutBody.setAttribute('transform',
    `rotate(${-angle * 0.85})`   // nut rotates opposite to wrench
  );

  // Occasional spark flash
  const sparkOpacity = (Math.random() < 0.04 && tightening) ? 0.9 : 0;
  sparks.setAttribute('opacity', sparkOpacity);

  // Slight wrench shake on "bite"
  if (Math.random() < 0.03 && tightening) {
    wrench.setAttribute('transform',
      `translate(220,220) rotate(${angle + wrenchOsc + (Math.random()*4-2)}) scale(1.015)`
    );
  }

  requestAnimationFrame(animate);
}

animate();
</script>
</body>
</html>
