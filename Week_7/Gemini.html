<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gemini - Basketball Animation</title>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --ball-color: #ff8c00;
            --rim-color: #e63946;
            --net-color: rgba(255, 255, 255, 0.8);
            --backboard-color: #ffffff;
        }

        body {
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: var(--bg-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .court-container {
            position: relative;
            width: 800px;
            height: 500px;
            background: linear-gradient(to bottom, #ffffff 0%, #dbe2ef 100%);
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        /* --- Hoop Elements --- */
        .backboard {
            position: absolute;
            right: 50px;
            top: 100px;
            width: 10px;
            height: 100px;
            background: var(--backboard-color);
            border: 2px solid #333;
            border-radius: 2px;
        }

        .rim {
            position: absolute;
            right: 60px;
            top: 170px;
            width: 60px;
            height: 8px;
            background: var(--rim-color);
            border-radius: 10px;
            z-index: 10;
        }

        .net {
            position: absolute;
            right: 65px;
            top: 178px;
            width: 50px;
            height: 60px;
            background: repeating-linear-gradient(45deg, transparent, transparent 5px, var(--net-color) 5px, var(--net-color) 6px),
                        repeating-linear-gradient(-45deg, transparent, transparent 5px, var(--net-color) 5px, var(--net-color) 6px);
            clip-path: polygon(0 0, 100% 0, 80% 100%, 20% 100%);
            z-index: 5;
        }

        /* --- The Ball --- */
        .ball {
            position: absolute;
            width: 40px;
            height: 40px;
            background-color: var(--ball-color);
            background-image: 
                radial-gradient(circle at 30% 30%, #ffad42, transparent),
                linear-gradient(0deg, transparent 45%, #333 45%, #333 55%, transparent 55%),
                linear-gradient(90deg, transparent 45%, #333 45%, #333 55%, transparent 55%);
            border: 2px solid #333;
            border-radius: 50%;
            bottom: 50px;
            left: 50px;
            z-index: 15;
            box-shadow: inset -5px -5px 10px rgba(0,0,0,0.2);
            animation: shoot 3s infinite cubic-bezier(0.35, 0, 0.65, 1);
        }

        /* --- Animation --- */
        @keyframes shoot {
            0% {
                transform: translate(0, 0) rotate(0deg);
                opacity: 1;
            }
            /* The Arc: Peak height reached midway */
            40% {
                transform: translate(320px, -350px) rotate(180deg);
            }
            /* Swish: Entering the hoop */
            60% {
                transform: translate(650px, -285px) rotate(360deg);
                opacity: 1;
                z-index: 15; /* In front of rim */
            }
            /* Falling through the net */
            75% {
                transform: translate(650px, 0px) rotate(450deg);
                opacity: 1;
                z-index: 1; /* Behind the rim/net now */
            }
            /* Fade out to loop */
            90%, 100% {
                transform: translate(650px, 50px) rotate(540deg);
                opacity: 0;
            }
        }

        /* Floor Shadow */
        .shadow {
            position: absolute;
            width: 40px;
            height: 10px;
            background: rgba(0,0,0,0.1);
            border-radius: 50%;
            bottom: 40px;
            left: 50px;
            animation: shadow-move 3s infinite cubic-bezier(0.35, 0, 0.65, 1);
        }

        @keyframes shadow-move {
            0% { transform: scale(1); opacity: 0.4; left: 50px; }
            40% { transform: scale(0.5); opacity: 0.1; left: 370px; }
            60% { transform: scale(0.8); opacity: 0.2; left: 700px; }
            75% { transform: scale(1.2); opacity: 0.4; left: 700px; }
            100% { opacity: 0; left: 700px; }
        }

        .label {
            position: absolute;
            bottom: 20px;
            width: 100%;
            text-align: center;
            color: #999;
            font-weight: 300;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="court-container">
        <div class="backboard"></div>
        <div class="rim"></div>
        <div class="net"></div>
        
        <div class="shadow" id="shadow"></div>
        <div class="ball" id="ball"></div>

        <div class="label">GEMINI PHYSICS ENGINE</div>
    </div>

    <script>
        // JavaScript used here to dynamically adjust the animation timing or 
        // interaction if needed. For now, it ensures the animation syncs 
        // cleanly upon tab focus.
        document.addEventListener("visibilitychange", () => {
            const ball = document.getElementById('ball');
            const shadow = document.getElementById('shadow');
            if (!document.hidden) {
                // Reset animation to sync ball and shadow
                ball.style.animation = 'none';
                shadow.style.animation = 'none';
                void ball.offsetWidth; // Trigger reflow
                ball.style.animation = null;
                shadow.style.animation = null;
            }
        });
    </script>
</body>
</html>
